# Reasoning-effort evidence for models the pi-ai catalog does not cover.
#
# This file is the *patch layer*, not the primary source. Start from the pi-ai
# catalog (a route named after a catalog provider inherits it for free); add an
# entry here only when the catalog has nothing and a provider's own documentation
# does.
#
# Rules for an entry:
#   * every claim needs `source` (a URL) and `evidence`;
#   * `efforts` must use DSH's seven level names, and only `off` may be null;
#   * never guess. If neither the catalog nor a vendor page says it, leave the
#     model out — the writer then reports it as unknown and changes nothing.
#   * `match` names the model plus the gateway (`baseURL`) the fact is about. Scope the
#     entry to one route (`provider`) only when two routes to the same gateway genuinely
#     differ — the same model served by the same gateway has one answer, and a route name
#     is a label the user is free to change.
#
# evidence: probe > vendor > catalog > unknown  (see scripts/lib/capability.mjs)
version: 1
entries:
  - match:
      baseURL: https://opencode.ai/zen/go/v1
      model: deepseek-flash
    reasoning: true
    efforts:
      'off': null
      low: low
      high: high
      max: max
    evidence: vendor
    source: https://api-docs.deepseek.com/quick_start/pricing
    note: >-
      Vendor documents thinking + non-thinking modes with reasoning_effort none|low|high|max. The gateway's `/zen/go/v1` surface is undocumented, so the level set is a passthrough claim: the levels
      are what the model accepts, not a promise that this route forwards them.
  - match:
      baseURL: https://opencode.ai/zen/go/v1
      model: deepseek-v4.1-flash
    reasoning: true
    efforts:
      'off': null
      low: low
      high: high
      max: max
    evidence: vendor
    source: https://api-docs.deepseek.com/quick_start/pricing
    note: Same family as deepseek-v4-flash; vendor-documented thinking controls.
  - match:
      baseURL: https://opencode.ai/zen/go/v1
      model: mimo-v2.6-flash
    decidedAt: '2026-09-22'
    evidence: vendor
    source: https://raw.githubusercontent.com/anomalyco/models.dev/dev/providers/opencode-go/models/mimo-v2.6-flash.toml
    reasoning: false
    note: 'vendor decision: non-reasoning model'
  - match:
      baseURL: https://opencode.ai/zen/go/v1
      model: mimo-v2.6-pro
    decidedAt: '2026-09-22'
    evidence: vendor
    source: https://raw.githubusercontent.com/anomalyco/models.dev/dev/providers/opencode-go/models/mimo-v2.6-pro.toml
    reasoning: false
    note: 'vendor decision: non-reasoning model'
